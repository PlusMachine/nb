<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Сколько сахара в бутылку при розливе: 0,5 л — 3–4 г; 1 л — 7 г; 1,5 л — 10 г; 2 л — 14 г. Правило: около 7 граммов на литр" font-family="'Rubik', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="758" height="248" rx="20" fill="#FFFFFF" stroke="#E4E4E7"/>

  <text x="30" y="42" font-size="18" font-weight="600" fill="#09090B">Сколько сахара в бутылку</text>
  <text x="730" y="42" text-anchor="end" font-size="14" font-weight="500" fill="#71717A">правило: ~7 г на литр</text>
  <line x1="30" y1="58" x2="730" y2="58" stroke="#E4E4E7"/>

  <!-- 0,5 л -->
  <g fill="#F59E0B">
    <rect x="128" y="152" width="44" height="36" rx="6"/>
    <path d="M128 152 L142 138 L158 138 L172 152 Z"/>
    <rect x="142" y="126" width="16" height="12"/>
  </g>
  <rect x="134" y="158" width="6" height="24" rx="3" fill="#FBBF24"/>
  <rect x="139" y="118" width="22" height="9" rx="2" fill="#27272A"/>
  <text x="150" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#71717A">0,5 л</text>
  <text x="150" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#09090B">3–4 г</text>

  <!-- 1 л -->
  <g fill="#F59E0B">
    <rect x="311" y="135" width="48" height="53" rx="6"/>
    <path d="M311 135 L326.5 121 L343.5 121 L359 135 Z"/>
    <rect x="326.5" y="108" width="17" height="13"/>
  </g>
  <rect x="317" y="141" width="6" height="41" rx="3" fill="#FBBF24"/>
  <rect x="322" y="100" width="26" height="9" rx="2" fill="#27272A"/>
  <text x="335" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#71717A">1 л</text>
  <text x="335" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#09090B">7 г</text>

  <!-- 1,5 л -->
  <g fill="#F59E0B">
    <rect x="494" y="124" width="52" height="64" rx="6"/>
    <path d="M494 124 L511 110 L529 110 L546 124 Z"/>
    <rect x="511" y="96" width="18" height="14"/>
  </g>
  <rect x="500" y="130" width="6" height="52" rx="3" fill="#FBBF24"/>
  <rect x="507" y="88" width="26" height="9" rx="2" fill="#27272A"/>
  <text x="520" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#71717A">1,5 л</text>
  <text x="520" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#09090B">10 г</text>

  <!-- 2 л -->
  <g fill="#F59E0B">
    <rect x="672" y="113" width="56" height="75" rx="6"/>
    <path d="M672 113 L690.5 99 L709.5 99 L728 113 Z"/>
    <rect x="690.5" y="84" width="19" height="15"/>
  </g>
  <rect x="678" y="119" width="6" height="63" rx="3" fill="#FBBF24"/>
  <rect x="686" y="76" width="28" height="9" rx="2" fill="#27272A"/>
  <text x="700" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#71717A">2 л</text>
  <text x="700" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#09090B">14 г</text>
</svg>
