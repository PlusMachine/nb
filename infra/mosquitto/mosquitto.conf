# =============================================================================
#  BrewForge MQTT broker — минимальная dev-конфигурация (Eclipse Mosquitto 2.x).
#
#  Разрешает подключение устройства (ESP32 / apps/device-sim) и моста
#  (apps/bridge) к одному брокеру на 1883.
#
#  ⚠ ПРОДАКШН-FOLLOW-UP (НЕ для прод): здесь allow_anonymous true и без TLS.
#  Для прода: TLS-listener (8883), per-device логины/пароли или mTLS-сертификаты,
#  ACL на топики brewforge/<deviceId>/# (устройство видит только свой префикс).
# =============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# Без персистентности — телеметрия живёт в Postgres, не в брокере.
persistence false

# Логи в stdout контейнера.
log_dest stdout
log_type warning
log_type notice
