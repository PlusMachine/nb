services:
  postgres:
    image: postgres:16-alpine
    container_name: nb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: nb-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # BrewForge MQTT broker (cloud realtime path). Устройство (ESP32 / device-sim)
  # и мост (apps/bridge) подключаются сюда. TLS/пароли — продакшн-follow-up
  # (см. infra/mosquitto/mosquitto.conf).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nb-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pg_data:
