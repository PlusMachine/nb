&quot;:&quot;R210&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 1A · Американский лёгкий лагер&quot;,&quot;before&quot;:&quot;Ледяной, лёгкий до прозрачности лагер почти без вкусовых акцентов: сплошная свежесть, газ и жажда, которой он не оставляет ни шанса.&quot;,&quot;after&quot;:&quot;Лёгкий лагер с мягким вкусом и выраженной карбонизацией.&quot;,&quot;reason&quot;:&quot;«Лёгкий до прозрачности» и «жажда без шанса» — натянутые рекламные образы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:12}]},{&quot;id&quot;:&quot;R211&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 1B · Американский лагер&quot;,&quot;before&quot;:&quot;Светлый, звонко газированный лагер с чистым зерновым тоном и едва заметной горчинкой. Пиво без претензий: его пьют холодным и большими глотками.&quot;,&quot;after&quot;:&quot;Светлый лагер с зерновыми нотами, слабой горечью и выраженной карбонизацией.&quot;,&quot;reason&quot;:&quot;«Звонко газированный» и «пиво без претензий» заменены описанием вкуса.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:13}]},{&quot;id&quot;:&quot;R212&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 1C · Крим-эль&quot;,&quot;before&quot;:&quot;Золотистый эль, сваренный с лагерной аккуратностью: мягкое зерно, чистый вкус, шелковистая текстура. Характера больше, чем у светлого лагера, лёгкости — не меньше.&quot;,&quot;after&quot;:&quot;Золотистый эль с мягким зерновым вкусом и шелковистой текстурой.&quot;,&quot;reason&quot;:&quot;«Лагерная аккуратность» и сравнение количества «характера» звучат искусственно.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:14}]},{&quot;id&quot;:&quot;R213&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 2A · Международный светлый лагер&quot;,&quot;before&quot;:&quot;Классический светлый лагер интернационального образца: ровный, чистый, хорошо газированный, с деликатной горчинкой. Универсальное пиво к любому столу.&quot;,&quot;after&quot;:&quot;Светлый лагер с чистым вкусом, мягкой горечью и выраженной карбонизацией.&quot;,&quot;reason&quot;:&quot;«Интернационального образца» и «универсальное к любому столу» — канцеляризм и рекламный штамп.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:17}]},{&quot;id&quot;:&quot;R214&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 2B · Международный янтарный лагер&quot;,&quot;before&quot;:&quot;Янтарный лагер с карамельно-тостовой солодовой ноткой и мягкой горечью. Пьётся легко, а вкус теплее и круглее, чем у светлого собрата.&quot;,&quot;after&quot;:&quot;Янтарный лагер с нотами карамели и поджаренного хлеба, мягкой горечью.&quot;,&quot;reason&quot;:&quot;«Вкус теплее и круглее, чем у светлого собрата» — нагромождение образов.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:18}]},{&quot;id&quot;:&quot;R215&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 2C · Международный тёмный лагер&quot;,&quot;before&quot;:&quot;Тёмный лагер с лёгкой карамельной сладостью и намёком на жареный солод. Мягкий, округлый, без горькой обжарки — тёмное пиво для тех, кто любит полегче.&quot;,&quot;after&quot;:&quot;Тёмный лагер с лёгкой карамельной сладостью и мягкими нотами обжаренного солода.&quot;,&quot;reason&quot;:&quot;Убрана рекламная концовка «для тех, кто любит полегче».&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:19}]},{&quot;id&quot;:&quot;R216&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 3A · Чешский светлый лагер&quot;,&quot;before&quot;:&quot;Лёгкий чешский лагер с хлебным солодом и травяным жатецким хмелем. Сессионное пиво, ради которого в Чехии заходят в пивную каждый вечер.&quot;,&quot;after&quot;:&quot;Лёгкий чешский лагер с хлебными нотами солода и травяным ароматом жатецкого хмеля.&quot;,&quot;reason&quot;:&quot;Убрана выдуманная бытовая сценка про ежедневные походы в пивную.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:21}]},{&quot;id&quot;:&quot;R217&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 3B · Чешский премиальный светлый лагер&quot;,&quot;before&quot;:&quot;Золотой чешский лагер с густой пеной, богатым солодом и длинной благородной горечью жатецкого хмеля. Эталон, с которого начался весь пилснер.&quot;,&quot;after&quot;:&quot;Золотистый чешский лагер с густой пеной, насыщенным солодовым вкусом и долгой хмелевой горечью.&quot;,&quot;reason&quot;:&quot;«Богатый солод» и рекламное «эталон, с которого начался весь пилснер» заменены описанием пива.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:22}]},{&quot;id&quot;:&quot;R218&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 3C · Чешский янтарный лагер&quot;,&quot;before&quot;:&quot;Янтарный чешский лагер: карамель, хлебная корочка и травяной хмель в спокойном равновесии. Пиво неторопливое и уютное.&quot;,&quot;after&quot;:&quot;Янтарный чешский лагер с нотами карамели, хлебной корочки и травяного хмеля.&quot;,&quot;reason&quot;:&quot;«Пиво неторопливое и уютное» — шаблонная эмоциональная концовка.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:23}]},{&quot;id&quot;:&quot;R219&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 4A · Мюнхенский хеллес&quot;,&quot;before&quot;:&quot;Золотистый баварский лагер, где на первом плане мягкий хлебный солод, а хмель лишь подводит черту. Пиво, которое пьют литровыми кружками и не устают.&quot;,&quot;after&quot;:&quot;Золотистый баварский лагер с мягким хлебным вкусом солода и сдержанной хмелевой горечью.&quot;,&quot;reason&quot;:&quot;«Хмель подводит черту» и «пьют литровыми кружками и не устают» ничего не уточняют о вкусе.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:26}]},{&quot;id&quot;:&quot;R220&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 4B · Фестбир&quot;,&quot;before&quot;:&quot;Праздничный лагер Октоберфеста: светлый, солодовый, крепче обычного — и при этом опасно питкий.&quot;,&quot;after&quot;:&quot;Светлый солодовый лагер Октоберфеста, более крепкий, чем обычный светлый лагер.&quot;,&quot;reason&quot;:&quot;«Опасно питкий» — рекламная бравада.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:27}]},{&quot;id&quot;:&quot;R221&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 4C · Хеллес бок&quot;,&quot;before&quot;:&quot;Светлый бок: густой хлебный солод, заметная крепость и неожиданно сухой финиш, который зовёт к следующему глотку.&quot;,&quot;after&quot;:&quot;Крепкий светлый бок с насыщенным хлебным вкусом и сухим послевкусием.&quot;,&quot;reason&quot;:&quot;«Финиш зовёт к следующему глотку» — калька и шаблонный оборот.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:28}]},{&quot;id&quot;:&quot;R222&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 5A · Немецкий ляйхтбир&quot;,&quot;before&quot;:&quot;Облегчённый немецкий лагер: алкоголя мало, а солод и травяной хмель на месте. Пиво для долгого разговора.&quot;,&quot;after&quot;:&quot;Немецкий лагер невысокой крепости с солодовым вкусом и травяными нотами хмеля.&quot;,&quot;reason&quot;:&quot;«Солод и хмель на месте» и «пиво для долгого разговора» — расплывчатые формулы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:30}]},{&quot;id&quot;:&quot;R223&quot;,&quot;section&quot;:&quot;Описания для этикеток · лагеры и пшеничное&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 5B · Кёльш&quot;,&quot;before&quot;:&quot;Кёльнский эль, сваренный с лагерной чистотой: блестяще-светлый, тонкий, с лёгкой фруктовой ноткой и сухим финишем. Пьётся быстрее, чем успеваешь заметить.&quot;,&quot;after&quot;:&quot;Светлый кёльнский эль с чистым вкусом, лёгкими фруктовыми нотами и сухим послевкусием.&quot;,&quot;reason&quot;:&quot;«Лагерная чистота», «блестяще-светлый» и «пьётся быстрее, чем заметишь» зв t;after&quot;:&quot;Золотистый эль с мягким солодовым вкусом, тонким хмелевым ароматом и чистым послевкусием.&quot;,&quot;reason&quot;:&quot;«Без острых углов» и «знакомство с крафтом» — общие рекламные фразы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:83}]},{&quot;id&quot;:&quot;R258&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 18B · Американский пейл-эль&quot;,&quot;before&quot;:&quot;Светлый американский эль: цитрус, хвоя и косточковые фрукты от американского хмеля на мягкой солодовой основе. Свежесть и бодрая горчинка.&quot;,&quot;after&quot;:&quot;Светлый американский эль с мягкой солодовой основой и хмелевыми нотами цитрусов, хвои и косточковых фруктов.&quot;,&quot;reason&quot;:&quot;Убрана бессодержательная концовка «свежесть и бодрая горчинка».&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:84}]},{&quot;id&quot;:&quot;R259&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 19A · Американский янтарный эль&quot;,&quot;before&quot;:&quot;Янтарный американский эль: карамельный солод и цитрусовый хмель тянут одеяло каждый на себя — в этом весь смысл.&quot;,&quot;after&quot;:&quot;Янтарный американский эль с карамельным солодом и цитрусовым хмелевым ароматом.&quot;,&quot;reason&quot;:&quot;«Тянут одеяло каждый на себя — в этом весь смысл» звучит нарочито.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:86}]},{&quot;id&quot;:&quot;R260&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 19B · Калифорнийский коммон&quot;,&quot;before&quot;:&quot;Пиво калифорнийских старателей: лагерные дрожжи бродят в тепле — отсюда лёгкая фруктовость поверх поджаристого солода и смолистого хмеля.&quot;,&quot;after&quot;:&quot;Калифорнийское пиво на лагерных дрожжах при тёплом брожении. Во вкусе — поджаренный солод, смолистый хмель и лёгкие фруктовые ноты.&quot;,&quot;reason&quot;:&quot;Убрана декоративная история про старателей; сохранено объяснение особенностей брожения.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:87}]},{&quot;id&quot;:&quot;R261&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 19C · Американский браун-эль&quot;,&quot;before&quot;:&quot;Коричневый американский эль: шоколад и карамель солода, а поверх — цитрусовый хмель. Тёмное пиво с крафтовым акцентом.&quot;,&quot;after&quot;:&quot;Коричневый американский эль с шоколадно-карамельными нотами солода и цитрусовым хмелевым ароматом.&quot;,&quot;reason&quot;:&quot;«Крафтовый акцент» ничего конкретного не сообщает о пиве.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:88}]},{&quot;id&quot;:&quot;R262&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 20A · Американский портер&quot;,&quot;before&quot;:&quot;Американский портер: тёмный шоколад, кофе, обжарка — и хмелевая горечь, которой не бывает у британцев.&quot;,&quot;after&quot;:&quot;Американский портер с нотами тёмного шоколада, кофе и обжаренного солода, выраженной хмелевой горечью.&quot;,&quot;reason&quot;:&quot;Убрано категоричное сравнение «горечь, которой не бывает у британцев».&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:90}]},{&quot;id&quot;:&quot;R263&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 20B · Американский стаут&quot;,&quot;before&quot;:&quot;Чёрный американский стаут: жжёный кофе, тёмный шоколад и смолистый хмель. Крепко, горько, без компромиссов.&quot;,&quot;after&quot;:&quot;Американский стаут с нотами жжёного кофе, тёмного шоколада и смолистого хмеля.&quot;,&quot;reason&quot;:&quot;«Крепко, горько, без компромиссов» — рекламный штамп.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:91}]},{&quot;id&quot;:&quot;R264&quot;,&quot;section&quot;:&quot;Описания для этикеток · эли, портеры и стауты&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 20C · Имперский стаут&quot;,&quot;before&quot;:&quot;Имперский стаут: густой, как патока, с эспрессо, чёрным шоколадом, изюмом и долгим алкогольным теплом. Пиво для маленького бокала и длинного вечера.&quot;,&quot;after&quot;:&quot;Плотный имперский стаут с нотами эспрессо, тёмного шоколада и изюма, долгим согревающим послевкусием.&quot;,&quot;reason&quot;:&quot;«Маленький бокал и длинный вечер» — повторяющаяся рекламная конструкция.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:92}]},{&quot;id&quot;:&quot;R265&quot;,&quot;section&quot;:&quot;Описания для этикеток · IPA и крепкое пиво&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 21A · Американский IPA&quot;,&quot;before&quot;:&quot;Американский IPA: цитрус, хвоя, тропические фрукты — и сухая горечь, которая держит весь этот хмелевой напор.&quot;,&quot;after&quot;:&quot;Американский IPA с выраженной хмелевой горечью, ароматами цитрусов, хвои и тропических фруктов.&quot;,&quot;reason&quot;:&quot;«Горечь держит хмелевой напор» — неестественная метафора.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:94}]},{&quot;id&quot;:&quot;R266&quot;,&quot;section&quot;:&quot;Описания для этикеток · IPA и крепкое пиво&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 21B · Специальный IPA&quot;,&quot;before&quot;:&quot;IPA со сдвигом: узнаваемая хмелевая горечь и сухой финиш, но собранные вокруг собственной идеи — своего солода, своих дрожжей, своего цвета.&quot;,&quot;after&quot;:&quot;IPA с выраженной хмелевой горечью и сухим послевкусием. Характер зависит от выбранного солода, дрожжей и других особенностей рецепта.&quot;,&quot;reason&quot;:&quot;«IPA со сдвигом» и «собранные вокруг собственной идеи» похожи на буквальный перевод.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:95}]},{&quot;id&quot;:&quot;R267&quot;,&quot;section&quot;:&quot;Описания для этикеток · IPA и крепкое пиво&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 21B-belgian-ipa&quot;,&quot;before&quot;:&quot;Бельгийский IPA: американский хмель встречает бельгийские дрожжи — цитрус и хвоя поверх перечной пряности и сухого финиша.&quot;,&quot;after&quot;:&quot;Бельгийский IPA с цитрусово-хвойным хмелевым ароматом, перечной пряностью дрожжей и сухим послевкусием.&quot;,&quot;reason&quot;:&quot;«Хмель встречает дрожжи» — рекламный шаблон; «финиш» заменён русским словом.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:96}]},{&quot;id&quot;:&quot;R268&quot;,&quot;section&quot;:&quot;Описания для этикеток · IPA и крепкое пиво&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 21B-black-ipa&quot;,&quot;before&quot;:&quot;Чёрный IPA: ц ot;before&quot;:&quot;Солоноватое пшеничное с кориандром: лёгкая молочная кислинка, щепотка соли и звонкая свежесть. Жажду снимает мгновенно.&quot;,&quot;after&quot;:&quot;Лёгкое пшеничное пиво с кориандром, мягкой молочной кислинкой и солоноватым вкусом.&quot;,&quot;reason&quot;:&quot;Убраны «звонкая свежесть» и рекламное «жажду снимает мгновенно».&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:116}]},{&quot;id&quot;:&quot;R283&quot;,&quot;section&quot;:&quot;Описания для этикеток · кислое и бельгийское&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 24B · Бельгийский светлый эль&quot;,&quot;before&quot;:&quot;Медный бельгийский эль на каждый день: тостовый солод, груша и лёгкая пряность дрожжей при спокойной горечи.&quot;,&quot;after&quot;:&quot;Медный бельгийский эль с нотами поджаренного хлеба, груши и лёгких пряностей, мягкой горечью.&quot;,&quot;reason&quot;:&quot;«На каждый день» и «спокойная горечь» — рекламные обороты; «тостовый» раскрыт.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:119}]},{&quot;id&quot;:&quot;R284&quot;,&quot;section&quot;:&quot;Описания для этикеток · кислое и бельгийское&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 25B · Сэзон&quot;,&quot;before&quot;:&quot;Фермерский эль Валлонии: сухой, искристый, с перцем, цитрусом и травами. Варили его для полевых работ, а пьют круглый год.&quot;,&quot;after&quot;:&quot;Сухой валлонский эль с выраженной карбонизацией, нотами перца, цитрусов и трав.&quot;,&quot;reason&quot;:&quot;История «для полевых работ, а пьют круглый год» заменена свойствами пива.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:123}]},{&quot;id&quot;:&quot;R285&quot;,&quot;s :&quot;«Срастаются с основой» и «на стыке бокала и пинты» — натянутые образы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:149}]},{&quot;id&quot;:&quot;R305&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 30A · Пиво со специями, травами или овощами&quot;,&quot;before&quot;:&quot;Пиво со специями, травами или овощами: добавка ведёт аромат и вкус, но пиво под ней по-прежнему узнаётся.&quot;,&quot;after&quot;:&quot;Пиво со специями, травами или овощами, которые дополняют аромат и вкус базового пива.&quot;,&quot;reason&quot;:&quot;«Добавка ведёт аромат» — неестественная калька.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:151}]},{&quot;id&quot;:&quot;R306&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 30B · Осеннее сезонное пиво&quot;,&quot;before&quot;:&quot;Осеннее пиво: тыква, корица, мускат и имбирь на тёплой солодовой основе. Вкус урожая и первых холодов.&quot;,&quot;after&quot;:&quot;Осеннее пиво с солодовым вкусом и нотами тыквы, корицы, мускатного ореха и имбиря.&quot;,&quot;reason&quot;:&quot;«Вкус урожая и первых холодов» — сезонный рекламный штамп.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:152}]},{&quot;id&quot;:&quot;R307&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 30C · Зимнее сезонное пиво&quot;,&quot;before&quot;:&quot;Зимнее пиво: тёмное, крепкое, с пряностями, сухофруктами и согревающим финишем. Праздничный бокал в холодный вечер.&quot;,&quot;after&quot;:&quot;Крепкое тёмное зимнее пиво с нотами пряностей и сухофруктов, согревающим послевкусием.&quot;,&quot;reason&quot;:&quot;«Праздничный бокал в холодный вечер» — шаблонная сценка.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:153}]},{&quot;id&quot;:&quot;R308&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 30D · Специальное пиво со специями, травами или овощами&quot;,&quot;before&quot;:&quot;Специи, травы или овощи плюс ещё один приём — дым, дерево, фрукты. Всё это должно звучать вместе, не заглушая друг друга.&quot;,&quot;after&quot;:&quot;Пиво со специями, травами или овощами и дополнительными особенностями: копчёными, древесными или фруктовыми нотами.&quot;,&quot;reason&quot;:&quot;«Ещё один приём» и «всё должно звучать вместе» заменены конкретным перечислением.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:154}]},{&quot;id&quot;:&quot;R309&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 31A · Пиво с альтернативными зерновыми&quot;,&quot;before&quot;:&quot;Пиво на нестандартном зерне: рожь, овёс, спельта или гречка вносят свою фактуру и хлебный характер.&quot;,&quot;after&quot;:&quot;Пиво с рожью, овсом, спельтой, гречкой или другим нетипичным для базового стиля зерном.&quot;,&quot;reason&quot;:&quot;«Вносят свою фактуру» — неестественный перенос слова из другой области.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:156}]},{&quot;id&quot;:&quot;R310&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 31B · Пиво с альтернативными сахарами&quot;,&quot;before&quot;:&quot;Пиво на особых сахарах: мёд, кленовый сироп, патока или пальмовый сахар добавляют аромат и сухость. Но это по-прежнему пиво.&quot;,&quot;after&quot;:&quot;Пиво с мёдом, кленовым сиропом, патокой или пальмовым сахаром, которые добавляют свои оттенки аромата и вкуса.&quot;,&quot;reason&quot;:&quot;«Но это по-прежнему пиво» — бессодержательная рекламная концовка.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:157}]},{&quot;id&quot;:&quot;R311&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 32A · Копчёная версия классического стиля&quot;,&quot;before&quot;:&quot;Классический стиль под дымом: копчёный солод добавляет костра и копчёностей, не ломая узнаваемый профиль.&quot;,&quot;after&quot;:&quot;Пиво классического стиля с копчёным солодом, ароматом дыма и копчёностей.&quot;,&quot;reason&quot;:&quot;«Стиль под дымом» и «не ломая профиль» — искусственные метафоры.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:159}]},{&quot;id&quot;:&quot;R312&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 32B · Специальное копчёное пиво&quot;,&quot;before&quot;:&quot;Дым и что-то ещё — фрукты, специи, бочка. Сложное копчёное пиво, которое держится на балансе.&quot;,&quot;after&quot;:&quot;Копчёное пиво с дополнительными фруктовыми, пряными или бочковыми нотами.&quot;,&quot;reason&quot;:&quot;«Дым и что-то ещё» и «держится на балансе» — расплывчатые формулы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:160}]},{&quot;id&quot;:&quot;R313&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 33B · Специальное пиво с древесной выдержкой&quot;,&quot;before&quot;:&quot;Пиво, выдержанное в бочке из-под бурбона, рома или вина: к дубу добавляется дух того, что жило в бочке раньше, — ваниль, карамель, алкогольное тепло.&quot;,&quot;after&quot;:&quot;Пиво, выдержанное в бочке из-под бурбона, рома или вина, с древесными нотами и ароматом напитка, который был в бочке раньше.&quot;,&quot;reason&quot;:&quot;«Дух того, что жило в бочке» — чрезмерное олицетворение.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:163}]},{&quot;id&quot;:&quot;R314&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 34A · Специальное пиво по коммерческому образцу&quot;,&quot;before&quot;:&quot;Домашняя версия конкретного коммерческого сорта — того, что не укладывается ни в один стиль гайдлайна.&quot;,&quot;after&quot;:&quot;Домашняя версия конкретного коммерческого пива, которое не укладывается в категории справочника BJCP.&quot;,&quot;reason&quot;:&quot;«Стиль гайдлайна» — буквальная калька.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:165}]},{&quot;id&quot;:&quot;R315&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 34B · Пиво смешанного стилевого типа&quot;,&quot;before&quot;:&quot;Два стиля в одном бокале: гибрид берёт лучшее от каждого и не притворяется ни одним из них.&quot;,&quot;after&quot;:&quot;Пиво, сочетающее характерные признаки двух стилей.&quot;,&quot;reason&quot;:&quot;«Берёт лучшее» и «не притворяется» — рекламная оценка и олицетворение.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:166}]},{&quot;id&quot;:&quot;R316&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · 34C · Экспериментальное пиво&quot;,&quot;before&quot;:&quot;Пиво вне правил: своя идея, свои ингредиенты, свой процесс. Стиля для него ещё не придумали.&quot;,&quot;after&quot;:&quot;Экспериментальное пиво с необычными ингредиентами или способом приготовления, не относящееся к установленным стилям.&quot;,&quot;reason&quot;:&quot;«Пиво вне правил: своя идея, свои ингредиенты» — рекламный шаблон.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:167}]},{&quot;id&quot;:&quot;R317&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · X1 · Дорада пампеана&quot;,&quot;before&quot;:&quot;Аргентинский золотистый эль: мягкий солод, деликатная фруктовость и лёгкая горчинка. Пиво, созданное, чтобы пить его много.&quot;,&quot;after&quot;:&quot;Аргентинский золотистый эль с мягким солодовым вкусом, лёгкими фруктовыми нотами и слабой горечью.&quot;,&quot;reason&quot;:&quot;Убрана рекламная концовка «созданное, чтобы пить его много».&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:169}]},{&quot;id&quot;:&quot;R318&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · X2 · IPA Аргента&quot;,&quot;before&quot;:&quot;Аргентинский IPA: местный хмель даёт цитрус и травы, горечь уверенная, но не жёсткая. Южноамериканское прочтение жанра.&quot;,&quot;after&quot;:&quot;Аргентинский IPA с цитрусовыми и травяными нотами местного хмеля, выраженной, но мягкой горечью.&quot;,&quot;reason&quot;:&quot;«Южноамериканское прочтение жанра» — штамп культурной рецензии.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:170}]},{&quot;id&quot;:&quot;R319&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · X3 · Итальянский виноградный эль&quot;,&quot;before&quot;:&quot;Итальянский эль с виноградом: сусло местных лоз приносит винную кислинку и ягодный аромат. Пиво с виноградника.&quot;,&quot;after&quot;:&quot;Итальянский эль с виноградным суслом, винной кислинкой и ягодным ароматом.&quot;,&quot;reason&quot;:&quot;«Сусло местных лоз» и «пиво с виноградника» — декоративные формулы.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:171}]},{&quot;id&quot;:&quot;R320&quot;,&quot;section&quot;:&quot;Описания для этикеток · другие стили&quot;,&quot;where&quot;:&quot;Описание по умолчанию · X4 · Катарина сауэр&quot;,&quot;before&quot;:&quot;Бразильский кислый: свежие тропические фрукты и чистая молочная кислинка в лёгком пшеничном теле. Пиво пляжной жары.&quot;,&quot;after&quot;:&quot;Лёгкое бразильское кислое пиво с тропическими фруктами и чистой молочной кислинкой.&quot;,&quot;reason&quot;:&quot;«Пиво пляжной жары» звучит искусственно, «в пшеничном теле» — калька.&quot;,&quot;kind&quot;:&quot;Описание пива&quot;,&quot;sources&quot;:[{&quot;file&quot;:&quot;packages/brewing-core/src/styles/taglines.ts&quot;,&quot;line&quot;:172}]}]}&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;nb-copy-review&#x27;);
  const data = JSON.parse(document.getElementById(&#x27;nb-copy-review-data&#x27;).textContent);
  const proposals = data.proposals;
  const byId = new Map(proposals.map(p =&gt; [p.id, p]));
  const decisions = new Map();
  const itemNodes = new Map();
  const sections = new Map();
  const audit = &#x27;nb-copy-2026-10-23-v1&#x27;;
  const status = root.querySelector(&#x27;#nb-review-status&#x27;);
  const sendButton = root.querySelector(&#x27;#nb-review-send&#x27;);
  const transfer = root.querySelector(&#x27;#nb-review-transfer&#x27;);
  const transferBox = root.querySelector(&#x27;.transfer-box&#x27;);
  const progress = root.querySelector(&#x27;#nb-review-progress&#x27;);
  let openSections = [proposals[0].section];
  let savingTimer;
  let applyExternal = false;
  let sendPending = false;
  let saveWarning = &#x27;&#x27;;
  const make = (tag, cls, content) =&gt; {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (content !== undefined) el.textContent = content;
    return el;
  };
  const current = id =&gt; decisions.get(id) || { choice:&#x27;pending&#x27;, text:&#x27;&#x27; };
  function readState(snapshot) {
    if (!snapshot || snapshot.modelContent?.audit !== audit) return false;
    decisions.clear();
    for (const row of snapshot.modelContent.decisions || []) {
      if (!Array.isArray(row) || !byId.has(row[0]) || ![&#x27;approve&#x27;,&#x27;reject&#x27;,&#x27;custom&#x27;].includes(row[1])) continue;
      decisions.set(row[0], {choice:row[1],text:typeof row[2] === &#x27;string&#x27; ? row[2] : &#x27;&#x27;});
    }
    for (const [id,text] of Object.entries(snapshot.privateContent?.drafts || {})) {
      if (byId.has(id) &amp;&amp; typeof text === &#x27;string&#x27; &amp;&amp; current(id).choice !== &#x27;custom&#x27;) {
        decisions.set(id, {...current(id),text});
      }
    }
    if (Array.isArray(snapshot.privateContent?.open)) openSections = snapshot.privateContent.open;
    return true;
  }
  function snapshot() {
    return {
      modelContent: {audit, decisions:[...decisions].filter(([,d])=&gt;d.choice!==&#x27;pending&#x27;).map(([id,d])=&gt; d.choice===&#x27;custom&#x27; ? [id,d.choice,d.text] : [id,d.choice])},
      privateContent: {
        open:[...sections].filter(([,s])=&gt;s.el.open).map(([name])=&gt;name),
        drafts:Object.fromEntries([...decisions].filter(([,d])=&gt;d.text &amp;&amp; d.choice!==&#x27;custom&#x27;).map(([id,d])=&gt;[id,d.text]))
      }
    };
  }
  async function persist() {
    if (applyExternal) return;
    if (!window.openai?.setWidgetState) {
      saveWarning = &#x27;Чтобы сохранить выбор, передайте решения в чат.&#x27;;
      status.textContent = saveWarning;
      return;
    }
    const state = snapshot();
    if (new TextEncoder().encode(JSON.stringify(state)).length &gt; 15500) {
      saveWarning = &#x27;Собственных вариантов слишком много для автосохранения. Передайте решения в чат до закрытия списка.&#x27;;
      status.textContent = saveWarning;
      return;
    }
    try {
      await window.openai.setWidgetState(state);
      saveWarning = &#x27;&#x27;;
      if (!sendPending) status.textContent = &#x27;Выбор сохранён. Правки в приложение ещё не внесены.&#x27;;
    } catch {
      saveWarning = &#x27;Не удалось сохранить выбор. Передайте решения в чат до закрытия списка.&#x27;;
      status.textContent = saveWarning;
    }
  }
  function scheduleSave() { clearTimeout(savingTimer); savingTimer = setTimeout(persist,250); }
  function refreshItem(id) {
    const n=itemNodes.get(id), d=current(id);
    for (const b of n.buttons) b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.choice===d.choice));
    n.custom.hidden=d.choice!==&#x27;custom&#x27;;
    if(n.input.value!==d.text) n.input.value=d.text;
    n.input.setAttribute(&#x27;aria-invalid&#x27;,String(d.choice===&#x27;custom&#x27; &amp;&amp; !d.text.trim()));
  }
  function updateCounts() {
    let approved=0,rejected=0,custom=0;
    for (const d of decisions.values()) {
      if(d.choice===&#x27;approve&#x27;)approved++;
      if(d.choice===&#x27;reject&#x27;)rejected++;
      if(d.choice===&#x27;custom&#x27;)custom++;
    }
    const total=approved+rejected+custom;
    progress.textContent=`Решено ${total} из ${proposals.length}`;

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);

          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);

    const tab = event.target?.closest?.(selector);

      return;

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
